services:
  api:
    build: .
    container_name: aibot_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  celery:
    build: .
    container_name: aibot_celery
    command: celery -A celery_worker.app worker --loglevel=info --pool=solo
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: aibot_redis
    ports:
      - "6379:6379"
